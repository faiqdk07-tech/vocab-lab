<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocab Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f2f5;
    --side: #e9e9ee;
    --card: #ffffff;
    --line: #d6d6dc;
    --line2: #e7e7ec;
    --text: #1d1d1f;
    --muted: #6e6e76;
    --accent: #0a66d8;
    --accent-soft: #e7f0fc;
    --ok: #1d8a3c;
    --ok-soft: #e8f6ec;
    --no: #cc3329;
    --no-soft: #fdeceb;
    --note: #fff7e0;
    --note-line: #ecd9a0;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: #dcdce2; color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ================= kerangka ================= */
  .app {
    max-width: 1060px; margin: 28px auto; min-height: 680px;
    display: grid; grid-template-columns: 232px 1fr;
    background: var(--bg); border: 1px solid #c4c4cb; border-radius: 12px; overflow: hidden;
    box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 12px 32px rgba(0,0,0,.08);
  }
  .side { background: var(--side); border-right: 1px solid var(--line); padding: 16px 10px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 16px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .logo {
    width: 34px; height: 34px; border-radius: 8px; background: var(--text); color: #fff;
    display: grid; place-items: center; font: 700 14px var(--mono); flex: none;
  }
  .bname { font-weight: 700; font-size: 15px; line-height: 1.2; }
  .bsub { font-size: 12px; color: var(--muted); }
  .nav { display: grid; gap: 2px; }
  .nav button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 7px 8px; border: 0; border-radius: 7px; background: none; cursor: pointer; font-size: 14px;
  }
  .nav button:hover { background: rgba(0,0,0,.05); }
  .nav button.active { background: var(--accent); color: #fff; }
  .ico {
    width: 24px; height: 24px; border-radius: 6px; flex: none; background: var(--c);
    color: #fff; display: grid; place-items: center; font: 700 12px var(--mono);
  }
  main { padding: 26px 30px 40px; min-width: 0; }

  /* ================= teks & grup ================= */
  .vtitle { font-size: 24px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.01em; }
  .vsub { margin: 0 0 20px; color: var(--muted); max-width: 62ch; }
  .glabel { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 6px 2px; }
  .group { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .group.pad { padding: 14px 16px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--line2); }
  .row:first-child { border-top: 0; }
  .row.between { justify-content: space-between; }
  .row.wrap { flex-wrap: wrap; }
  .row.small { font-size: 13px; }
  .rt { font-weight: 600; }
  .rd { font-size: 13px; color: var(--muted); }
  .muted { color: var(--muted); }
  .minw { min-width: 0; }
  .stepno {
    width: 26px; height: 26px; flex: none; border-radius: 6px; border: 1px solid var(--line);
    display: grid; place-items: center; font: 700 13px var(--mono); background: var(--bg);
  }
  .note { font-size: 13px; padding: 10px 14px; margin-bottom: 12px; background: var(--note); border: 1px solid var(--note-line); border-radius: 8px; }

  /* ================= tombol ================= */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 7px 16px; border: 1px solid var(--line); border-radius: 7px; background: var(--card);
    font-size: 14px; font-weight: 500; cursor: pointer; box-shadow: 0 1px 1px rgba(0,0,0,.04);
  }
  .btn:hover { border-color: #b9b9c1; }
  .btn:active { background: #f0f0f3; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #0859bd; }
  .btn.big { padding: 10px 26px; font-size: 15px; }
  .btn.small { padding: 4px 10px; font-size: 13px; }
  .btn.danger { color: var(--no); }
  .btn.ghost { background: none; box-shadow: none; color: var(--muted); }
  .btn:focus-visible, .opt:focus-visible, .nav button:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .actions .keys { margin-right: auto; font-size: 12px; color: var(--muted); }

  .seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; background: #e2e2e7; border-radius: 8px; }
  .seg button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .seg button.active { background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.14); font-weight: 600; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }

  /* ================= stepper ================= */
  .stepper {
    display: grid; grid-template-columns: repeat(6, 1fr);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 18px;
  }
  .step { display: flex; align-items: center; gap: 7px; padding: 9px 10px; border-left: 1px solid var(--line2); font-size: 12.5px; min-width: 0; }
  .step:first-child { border-left: 0; }
  .step .n {
    width: 20px; height: 20px; flex: none; border-radius: 50%; border: 1px solid var(--line);
    display: grid; place-items: center; font: 700 11px var(--mono); background: var(--bg);
  }
  .step .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step.current { background: var(--accent-soft); font-weight: 600; }
  .step.current .n { background: var(--accent); border-color: var(--accent); color: #fff; }
  .step.done .n { background: var(--ok); border-color: var(--ok); color: #fff; }
  .step.skip { color: var(--muted); }
  .step.skip .t { text-decoration: line-through; }
  .steptitle { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .steptitle b { display: block; font-size: 17px; }
  .steptitle span { font-size: 13px; color: var(--muted); }

  /* ================= soal ================= */
  .qcard { padding: 16px 18px; }
  .qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .qtag {
    font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: .06em;
    color: var(--accent); background: var(--accent-soft); padding: 3px 8px; border-radius: 5px;
  }
  .qmeta { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .qprompt { font-size: 20px; margin: 12px 0 4px; line-height: 1.4; }
  .qsub { font-size: 14px; color: var(--muted); }
  .blank { font-family: var(--mono); color: var(--accent); font-weight: 700; }
  .chips { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .chip {
    display: inline-flex; flex-direction: column; align-items: center;
    padding: 3px 10px; background: #fffbea; border: 1px solid #e6d9a8; border-radius: 6px;
  }
  .chip b { font: 700 17px var(--mono); }
  .chip small { font-size: 11px; color: var(--muted); }
  .plus { font: 700 15px var(--mono); color: var(--muted); }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 11px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 9px;
    cursor: pointer; font-size: 15px;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt .num {
    width: 24px; height: 24px; flex: none; border-radius: 6px; border: 1px solid var(--line);
    display: grid; place-items: center; font: 700 12px var(--mono); background: var(--bg); color: var(--muted);
  }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .opt.correct .num { background: var(--ok); border-color: var(--ok); color: #fff; }
  .opt.wrong { border-color: var(--no); background: var(--no-soft); }
  .opt.wrong .num { background: var(--no); border-color: var(--no); color: #fff; }

  .feedback { margin-top: 12px; padding: 12px 16px; border-radius: 10px; border: 1px solid; font-size: 14px; }
  .feedback.ok { background: var(--ok-soft); border-color: #bfe3c9; }
  .feedback.no { background: var(--no-soft); border-color: #f2c4c0; }
  .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.ok .verdict { color: var(--ok); }
  .feedback.no .verdict { color: var(--no); }
  .feedback ul { margin: 6px 0 4px; padding-left: 20px; }

  /* ================= kartu kata ================= */
  .whead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line2); background: #fafafb; }
  .wword { font: 700 18px var(--mono); }
  .wmeta { color: var(--muted); font-size: 14px; }
  .tagmine { font-size: 11px; font-weight: 600; color: #a35a00; background: #fff1dc; border: 1px solid #f0d3a8; border-radius: 4px; padding: 0 6px; }
  .ftable { display: grid; }
  .frow2 { display: grid; grid-template-columns: minmax(120px, 1fr) 96px 1.4fr; align-items: center; gap: 12px; padding: 8px 16px; border-top: 1px solid var(--line2); }
  .frow2:first-child { border-top: 0; }
  .fw { font-family: var(--mono); font-weight: 700; font-size: 14px; }
  .fa { color: #3a3a40; }
  .pos { justify-self: start; font: 600 11px var(--mono); padding: 2px 7px; border-radius: 4px; border: 1px solid; }
  .pos-noun { color: #0a58b8; background: #eaf2fd; border-color: #c4dbf7; }
  .pos-verb { color: #7a3fc4; background: #f3ecfc; border-color: #dccaf4; }
  .pos-adjective { color: #b35c00; background: #fff2e2; border-color: #f2d2a6; }
  .pos-adverb { color: #1d7a3a; background: #e9f6ed; border-color: #c2e3cc; }
  .wparts { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; border-top: 1px solid var(--line2); background: #fcfcfd; }
  .plabel { font: 600 13px var(--mono); color: var(--muted); }

  /* ================= ringkasan & progres ================= */
  .sumhead { display: flex; align-items: center; gap: 18px; padding: 16px 18px; }
  .sumbig { font: 700 36px var(--mono); }
  .sumbig small, .sv small { font-size: .5em; color: var(--muted); }
  .num-r { font-family: var(--mono); font-weight: 700; }
  .boxes { display: inline-flex; gap: 3px; }
  .boxes i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #b9b9c1; background: #fff; }
  .boxes i.on { background: var(--accent); border-color: var(--accent); }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stat { padding: 14px 16px; margin: 0; }
  .sv { font: 700 26px var(--mono); }
  .sl { font-size: 13px; color: var(--muted); }
  .stats3 + .group { margin-top: 12px; }
  .pbar { height: 8px; background: #e2e2e7; border-radius: 4px; overflow: hidden; }
  .pbar span { display: block; height: 100%; background: var(--accent); }
  .wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .wcell { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 14px; border-top: 1px solid var(--line2); border-right: 1px solid var(--line2); margin: -1px -1px 0 0; }
  .wcell.done .fw { color: var(--ok); }

  /* ================= form ================= */
  .form { overflow: visible; }
  .fsec { padding: 14px 16px; border-top: 1px solid var(--line2); }
  .fsec:first-child { border-top: 0; }
  .fhead { margin-bottom: 10px; }
  .fhead b { display: block; }
  .fhead span { font-size: 13px; color: var(--muted); }
  input, select, textarea {
    width: 100%; padding: 7px 9px; font-size: 14px; background: var(--card);
    border: 1px solid var(--line); border-radius: 7px; min-width: 0;
  }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10,102,216,.15); }
  .frow { display: grid; grid-template-columns: 1.1fr .9fr 1.4fr 32px; gap: 6px; margin-bottom: 6px; }
  .prow { display: grid; grid-template-columns: 1fr 1.6fr 32px; gap: 6px; margin-bottom: 6px; }
  .fhdr { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .xbtn { border: 1px solid var(--line); background: var(--bg); border-radius: 7px; cursor: pointer; font-weight: 700; color: var(--muted); }
  .xbtn:hover { color: var(--no); border-color: var(--no); }
  .fl { display: grid; gap: 4px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .factions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; flex-wrap: wrap; background: #fafafb; }
  .fmsg { margin-right: auto; font-size: 13px; }
  .fmsg.ok { color: var(--ok); }
  .fmsg.no { color: var(--no); }

  .btn:disabled { opacity: .45; cursor: default; }
  .grow { flex: 1; }
  .row.col { flex-direction: column; align-items: flex-start; gap: 4px; }
  .fmt { font: 600 13px var(--mono); background: var(--bg); border: 1px solid var(--line2); border-radius: 5px; padding: 2px 8px; }
  #pasteBox { font: 13.5px/1.55 var(--mono); min-height: 220px; }
  #pasteBox::placeholder { color: #a5a5ad; }
  .det summary { cursor: pointer; list-style: none; display: flex; flex-direction: column; }
  .det summary::-webkit-details-marker { display: none; }
  .det summary b::before { content: "▸ "; color: var(--muted); }
  .det[open] summary b::before { content: "▾ "; }
  .det summary span { font-size: 13px; color: var(--muted); }
  .group > .det { border-top: 1px solid var(--line2); padding: 11px 16px; }
  .group > .det summary { font-size: 14px; color: var(--accent); flex-direction: row; }
  .pre { margin: 10px 0 0; padding: 12px; background: var(--bg); border: 1px solid var(--line2); border-radius: 8px; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }
  .subsec { padding-top: 14px; margin-top: 14px; border-top: 1px dashed var(--line); }
  .plist { display: grid; gap: 6px; }
  .pitem { border: 1px solid var(--line); border-left-width: 4px; border-radius: 7px; padding: 8px 12px; font-size: 13.5px; }
  .phead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .stl { font-size: 12px; font-weight: 600; }
  .st-new { border-left-color: var(--ok); } .st-new .stl { color: var(--ok); }
  .st-update { border-left-color: var(--accent); } .st-update .stl { color: var(--accent); }
  .st-builtin { border-left-color: #a0a0a8; } .st-builtin .stl { color: var(--muted); }
  .st-error { border-left-color: var(--no); background: var(--no-soft); } .st-error .stl { color: var(--no); }
  .perr { color: var(--no); font-size: 13px; margin-top: 2px; }
  .pnote { color: #9a5b00; font-size: 13px; margin-top: 2px; }

  .srcbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; padding: 10px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .srclabel { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .seg button:disabled { opacity: .4; cursor: default; }
  .glabel.between { display: flex; justify-content: space-between; align-items: center; }
  .glabel .btn { text-transform: none; letter-spacing: 0; }
  .checklist { max-height: 420px; overflow-y: auto; border-top: 1px solid var(--line2); }
  .crow { display: grid; grid-template-columns: 20px auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--line2); cursor: pointer; }
  .crow:first-child { border-top: 0; }
  .crow:hover { background: #fafafb; }
  .crow input { width: 18px; height: 18px; margin: 0; padding: 0; accent-color: var(--accent); }
  .cl-arti { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .numbox { display: flex; align-items: center; gap: 6px; }
  .numbox input { width: 72px; text-align: center; font-family: var(--mono); font-weight: 700; }
  .steps-det { padding: 0; }
  .steps-det > summary { padding: 11px 16px; color: var(--accent); font-size: 14px; flex-direction: row; }
  .steps-det[open] > summary { border-bottom: 1px solid var(--line2); }

  .srcbar { justify-content: space-between; }
  .srcmain { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .srcnow { font-weight: 600; }
  .srctoggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); cursor: pointer; }
  .srctoggle input { width: 18px; height: 18px; margin: 0; padding: 0; accent-color: var(--accent); }
  .trap { font-size: 11.5px; font-weight: 600; color: #9a5b00; background: #fff1dc; border: 1px solid #f0d3a8; border-radius: 4px; padding: 0 5px; margin-left: 4px; }
  .langbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; padding: 12px 6px 0; border-top: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .langbar .seg button { text-transform: none; letter-spacing: 0; font-weight: 600; padding: 4px 12px; }
  .empty { display: grid; gap: 6px; }
  .empty .btns { margin-top: 8px; }

  /* ================= layar kecil ================= */
  @media (max-width: 800px) {
    body { background: var(--bg); }
    .app { display: block; margin: 0; border: 0; border-radius: 0; box-shadow: none; min-height: 100vh; }
    .side { position: sticky; top: 0; z-index: 5; padding: 10px 12px 8px; border-right: 0; border-bottom: 1px solid var(--line); }
    .brand { padding: 0 2px 8px; margin-bottom: 8px; }
    .nav { grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .side { position: sticky; }
    .langbar { position: absolute; top: 12px; right: 12px; margin: 0; padding: 0; border: 0; }
    .langbar > span { display: none; }
    .nav button { flex-direction: column; gap: 3px; padding: 6px 2px; font-size: 11.5px; text-align: center; }
    main { padding: 18px 14px 40px; }
    .vtitle { font-size: 21px; }
    .options { grid-template-columns: 1fr; }
    .stats3 { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .sv { font-size: 20px; }
  }
  @media (max-width: 560px) {
    .step { justify-content: center; padding: 8px 4px; }
    .step:not(.current) .t { display: none; }
    .stepper { display: flex; }
    .step { flex: 1; }
    .step.current { flex: 3.5; justify-content: flex-start; padding-left: 10px; }
    .frow { grid-template-columns: 1fr 1fr 32px; }
    .frow .f-arti { grid-column: 1 / 3; grid-row: 2; }
    .frow .xbtn { grid-row: 1; grid-column: 3; }
    .frow.fhdr { display: none; }
    .frow { padding-bottom: 6px; border-bottom: 1px dashed var(--line2); }
    .grid2 { grid-template-columns: 1fr; gap: 0; }
    .frow2 { grid-template-columns: 1fr auto; }
    .frow2 .fa { grid-column: 1 / -1; margin-top: -4px; font-size: 14px; }
    .qprompt { font-size: 18px; }
    .stats3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">VL</div>
      <div><div class="bname">Vocab Lab</div><div class="bsub" id="badge"></div></div>
    </div>
    <nav class="nav">
      <button type="button" data-view="round"><span class="ico" style="--c:#0a66d8">▶</span><span>Ronde terpandu</span></button>
      <button type="button" data-view="free"><span class="ico" style="--c:#7a4fd6">≡</span><span>Latihan bebas</span></button>
      <button type="button" data-view="words"><span class="ico" style="--c:#e07a1f">+</span><span>Kata saya</span></button>
      <button type="button" data-view="progress"><span class="ico" style="--c:#2a9450">%</span><span>Progres</span></button>
    </nav>
    <div class="langbar"><span>Bahasa</span><div class="seg" id="langSeg"><button type="button" data-l="id">ID</button><button type="button" data-l="en">EN</button></div></div>
  </aside>
  <main>
    <section id="view-round"></section>
    <section id="view-free" hidden></section>
    <section id="view-words" hidden></section>
    <section id="view-progress" hidden></section>
  </main>
