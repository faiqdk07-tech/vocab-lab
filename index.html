<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c4bcf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#322c74" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vocab Lab">
<title>Vocab Lab</title>
<script>try{var t=localStorage.getItem("vocabLab.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
  /* ================= token warna (gaya sistem Apple) ================= */
  :root {
    color-scheme: light;
    --bg: #f7f7fb;
    --card: rgba(255,255,255,.86);
    --card2: rgba(255,255,255,.5);
    --mesh-base: #f7f7fb; --wash-top: #c4bcf7; --wash-mid: #e6e2fc;
    --wash-text: #14102e; --wash-text2: #423a78; --seg-bg: rgba(255,255,255,.55); --bubble: rgba(255,255,255,.95); --hdr: rgba(255,255,255,.86); --step-off: rgba(255,255,255,.7); --wash-glow: rgba(255,236,190,.55);
    --lx-1: #b9a9ff; --lx-2: #8b77ee; --lx-belly: #e3dcff; --lx-shadow: rgba(80,60,170,.18);
    --glow: rgba(110,100,190,.10); --rim: rgba(255,255,255,.7);
    --card-solid: #ffffff; --card2-solid: #f7f7fa; --tab-on: #ffffff;

    --fill: rgba(120,120,128,.12);
    --fill2: rgba(120,120,128,.08);
    --sep: rgba(60,60,67,.14);
    --line: rgba(60,60,67,.18);
    --line2: rgba(60,60,67,.10);
    --text: #000000;
    --text2: rgba(60,60,67,.85);
    --muted: rgba(60,60,67,.60);
    --side: rgba(255,255,255,.45);
    --bar: rgba(255,255,255,.72);

    --blue: #007aff;   --blue-t: #0066d6;
    --green: #34c759;  --green-t: #248a3d;
    --red: #ff3b30;    --red-t: #d70015;
    --orange: #ff9500; --orange-t: #c75c00;
    --purple: #af52de; --purple-t: #8944ab;
    --pink: #ff2d55;   --indigo: #5856d6;  --teal: #30b0c7;

    --accent: var(--blue);
    --accent-soft: rgba(0,122,255,.12);
    --ok: var(--green-t);
    --ok-soft: rgba(52,199,89,.14);
    --no: var(--red-t);
    --no-soft: rgba(255,59,48,.12);
    --note: rgba(255,204,0,.16);

    --hero-a: rgba(90,200,250,.30); --hero-b: rgba(233,231,255,.7); --hero-c: rgba(175,82,222,.22); --glass: rgba(255,255,255,.72);
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.02);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.05);
    --r: 14px;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif;
    --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif;
    --mono: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --code: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --spring: cubic-bezier(.32,.72,0,1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {color-scheme: dark;
      --bg: #0c0b16;
      --card: rgba(36,34,58,.62);
      --card2: rgba(44,42,68,.5);
      --mesh-base: #0c0b16; --wash-top: #322c74; --wash-mid: #1a173b;
      --wash-text: #ffffff; --wash-text2: rgba(232,228,255,.86); --seg-bg: rgba(255,255,255,.14); --bubble: #2e2a5c; --hdr: rgba(26,24,46,.9); --step-off: rgba(255,255,255,.16); --wash-glow: rgba(255,214,140,.10);
      --lx-1: #a796ff; --lx-2: #7461e0; --lx-belly: #cfc6ff; --lx-shadow: rgba(0,0,0,.45);
      --glow: rgba(0,0,0,.35); --rim: rgba(255,255,255,.08);
      --card-solid: #1c1c1e; --card2-solid: #232326; --tab-on: rgba(255,255,255,.14);

      --fill: rgba(118,118,128,.24);
      --fill2: rgba(118,118,128,.16);
      --sep: rgba(84,84,88,.55);
      --line: rgba(84,84,88,.65);
      --line2: rgba(84,84,88,.40);
      --text: #ffffff;
      --text2: rgba(235,235,245,.85);
      --muted: rgba(235,235,245,.60);
      --side: rgba(24,22,44,.55);
      --bar: rgba(30,28,50,.72);
      --blue: #0a84ff;   --blue-t: #409cff;
      --green: #30d158;  --green-t: #30d158;
      --red: #ff453a;    --red-t: #ff6961;
      --orange: #ff9f0a; --orange-t: #ffb340;
      --purple: #bf5af2; --purple-t: #da8fff;
      --pink: #ff375f;   --indigo: #5e5ce6;  --teal: #40c8e0;
      --accent-soft: rgba(10,132,255,.20);
      --ok-soft: rgba(48,209,88,.18);
      --no-soft: rgba(255,69,58,.18);
      --note: rgba(255,214,10,.14);
      --hero-a: rgba(10,132,255,.30); --hero-b: rgba(40,38,90,.6); --hero-c: rgba(191,90,242,.26); --glass: rgba(44,44,46,.72);
      --shadow: none;
      --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {color-scheme: dark;
      --bg: #0c0b16;
      --card: rgba(36,34,58,.62);
      --card2: rgba(44,42,68,.5);
      --mesh-base: #0c0b16; --wash-top: #322c74; --wash-mid: #1a173b;
      --wash-text: #ffffff; --wash-text2: rgba(232,228,255,.86); --seg-bg: rgba(255,255,255,.14); --bubble: #2e2a5c; --hdr: rgba(26,24,46,.9); --step-off: rgba(255,255,255,.16); --wash-glow: rgba(255,214,140,.10);
      --lx-1: #a796ff; --lx-2: #7461e0; --lx-belly: #cfc6ff; --lx-shadow: rgba(0,0,0,.45);
      --glow: rgba(0,0,0,.35); --rim: rgba(255,255,255,.08);
      --card-solid: #1c1c1e; --card2-solid: #232326; --tab-on: rgba(255,255,255,.14);

      --fill: rgba(118,118,128,.24);
      --fill2: rgba(118,118,128,.16);
      --sep: rgba(84,84,88,.55);
      --line: rgba(84,84,88,.65);
      --line2: rgba(84,84,88,.40);
      --text: #ffffff;
      --text2: rgba(235,235,245,.85);
      --muted: rgba(235,235,245,.60);
      --side: rgba(24,22,44,.55);
      --bar: rgba(30,28,50,.72);
      --blue: #0a84ff;   --blue-t: #409cff;
      --green: #30d158;  --green-t: #30d158;
      --red: #ff453a;    --red-t: #ff6961;
      --orange: #ff9f0a; --orange-t: #ffb340;
      --purple: #bf5af2; --purple-t: #da8fff;
      --pink: #ff375f;   --indigo: #5e5ce6;  --teal: #40c8e0;
      --accent-soft: rgba(10,132,255,.20);
      --ok-soft: rgba(48,209,88,.18);
      --no-soft: rgba(255,69,58,.18);
      --note: rgba(255,214,10,.14);
      --hero-a: rgba(10,132,255,.30); --hero-b: rgba(40,38,90,.6); --hero-c: rgba(191,90,242,.26); --glass: rgba(44,44,46,.72);
      --shadow: none;
      --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--mesh-base); color: var(--text);
    font: 15px/1.47 var(--sans); letter-spacing: -.01em;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  [hidden] { display: none !important; }
  ::selection { background: var(--accent-soft); }

  /* ================= kerangka ================= */
  .app { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
  /* ================= latar: gradasi lavender di atas ================= */
  .app { position: relative; isolation: isolate; }
  .backdrop {
    position: absolute; inset: 0 0 auto; height: 620px; z-index: -1; pointer-events: none;
    background:
      radial-gradient(70% 60% at 85% 0%, var(--wash-glow) 0%, transparent 70%),
      linear-gradient(180deg, var(--wash-top) 0%, var(--wash-mid) 45%, var(--mesh-base) 100%);
  }
  .group, .opt, .srcbar, .tile, .feat, .stat {
    -webkit-backdrop-filter: saturate(160%) blur(18px); backdrop-filter: saturate(160%) blur(18px);
  }
  .group, .srcbar, .feat { box-shadow: 0 6px 20px var(--glow), inset 0 0 0 .5px var(--rim); }
  .face { background: var(--card-solid); }
  .face.back { background: linear-gradient(160deg, var(--card-solid) 0%, var(--card2-solid) 100%); }

  /* teks di atas gradasi ungu: warna lebih tegas */
  .app .bsub, .app .vsub, .app .hero-sub, .app .langbar { color: var(--wash-text2); }
  .app .vtitle, .app .bname, .app .hero-hi { color: var(--wash-text); }
  .app .seg { background: var(--seg-bg); }
  .app .vsub { font-weight: 500; }

  /* ================= maskot Lexi ================= */
  .lexi-fig { padding: 0; border: 0; background: none; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .lexi-fig svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .lexi-fig .lx-body { transform-origin: 60px 112px; animation: lxIdle 3.6s ease-in-out infinite; }
  .lexi-fig .lx-shadow { fill: var(--lx-shadow); transform-origin: 60px 118px; animation: lxShadow 3.6s ease-in-out infinite; }
  .lexi-fig .lx-star { transform-box: fill-box; transform-origin: center; animation: lxStar 5s ease-in-out infinite; }
  .lexi-fig .lx-eye { transform-box: fill-box; transform-origin: center; transition: transform .08s; }
  .lexi-fig.blink .lx-eye { transform: scaleY(.1); }
  .lexi-fig .lx-pupil { transition: transform .12s ease-out; }
  .lexi-fig .lx-sparkles { transform-box: fill-box; transform-origin: center; animation: lxTwinkle 1.6s ease-in-out infinite; }
  .lexi-fig .lx-tear { animation: lxTear 1.8s ease-in infinite; }
  .lexi-fig .lx-zz { animation: lxZz 2.6s ease-in-out infinite; }
  .lexi-fig .lx-think circle { animation: lxThink 1.8s ease-in-out infinite; }
  .lexi-fig .lx-think circle:nth-child(2) { animation-delay: .2s; }
  .lexi-fig .lx-think circle:nth-child(3) { animation-delay: .4s; }
  .lexi-fig.hop .lx-body { animation: lxHop .6s var(--spring), lxIdle 3.6s ease-in-out .6s infinite; }
  .lexi-fig.hop .lx-star { animation: lxSpin .7s var(--spring); }
  .lexi-fig:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; border-radius: 24px; }

  /* beranda: sapaan di atas, gelembung di kiri Lexi */
  .hero-top {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "text lexi" "bubble lexi";
    align-items: end; column-gap: 6px; position: relative; z-index: 1;
  }
  .hero-text { grid-area: text; align-self: start; min-width: 0; padding-top: 6px; }
  .hero-top .hero-bubble {
    grid-area: bubble; justify-self: end; align-self: center; position: relative; max-width: 260px; margin: 10px 4px 22px 0;
    text-align: left; line-height: 1.35; animation: none; border-radius: 18px;
    background: var(--bubble); -webkit-backdrop-filter: none; backdrop-filter: none;
    box-shadow: 0 6px 18px var(--glow);
  }
  .hero-top .hero-bubble::after {
    content: ""; position: absolute; right: -7px; top: 50%; margin-top: -7px;
    border: 7px solid transparent; border-right-width: 0; border-left: 8px solid var(--bubble);
  }
  .hero-bubble.pop { animation: bubblePop .4s var(--spring); }
  @keyframes bubblePop { from { opacity: 0; transform: translateX(8px) scale(.92); } }
  .lexi { grid-area: lexi; width: 132px; height: 136px; margin-bottom: -12px; }

  /* Lexi di halaman lain */
  main > section.has-lexi { position: relative; }
  .page-lexi { position: absolute; top: -12px; right: -6px; width: 92px; height: 96px; z-index: 1; }
  .has-lexi > .vtitle, .has-lexi > .vsub { padding-right: 96px; }
  .lexi-short > .vtitle { min-height: 82px; margin-bottom: 10px; }
  .fb-lexi { float: right; width: 64px; height: 66px; margin: -10px -6px 0 10px; }
  .feedback { display: flow-root; }
  .empty { position: relative; padding-right: 112px !important; min-height: 120px; }
  .empty-lexi { position: absolute; right: 12px; bottom: 8px; width: 88px; height: 92px; }
  .sumhead { position: relative; }
  .sum-lexi { width: 84px; height: 88px; margin-left: auto; flex: none; }

  /* tombol tema */
  .lb-ctrls { display: flex; align-items: center; gap: 8px; }
  .theme-btn {
    width: 32px; height: 32px; flex: none; display: grid; place-items: center; border: 0; border-radius: 50%;
    background: var(--seg-bg); color: var(--wash-text); cursor: pointer; transition: transform .2s var(--spring);
  }
  .theme-btn svg { width: 18px; height: 18px; }
  .theme-btn:active { transform: scale(.9) rotate(-20deg); }
  .theme-btn:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
  @keyframes lxIdle { 50% { transform: translateY(-4px) scale(1.01, .99); } }
  @keyframes lxShadow { 50% { transform: scaleX(.86); opacity: .7; } }
  @keyframes lxStar { 50% { transform: rotate(14deg) scale(1.08); } }
  @keyframes lxSpin { to { transform: rotate(360deg) scale(1); } }
  @keyframes lxTwinkle { 50% { opacity: .45; transform: scale(.82); } }
  @keyframes lxTear { 0% { transform: translateY(-2px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(10px); opacity: 0; } }
  @keyframes lxZz { 50% { transform: translate(3px, -4px); opacity: .55; } }
  @keyframes lxThink { 50% { opacity: .4; } }
  @keyframes lxHop {
    0% { transform: scale(1, 1); }
    18% { transform: scale(1.1, .86); }
    45% { transform: translateY(-20px) scale(.94, 1.08); }
    70% { transform: translateY(0) scale(1.06, .94); }
    100% { transform: none; }
  }


  html, body { background: var(--mesh-base); }
  .side {
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column;
    background: var(--side); border-right: .5px solid var(--sep);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    padding: 22px 12px 16px;
  }
  .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 20px; }
  .logo {
    width: 40px; height: 40px; border-radius: 10px; flex: none;
    background: linear-gradient(145deg, #5ac8fa 0%, #007aff 55%, #5856d6 100%);
    color: #fff; display: grid; place-items: center;
    font: 700 15px var(--mono); letter-spacing: 0;
    box-shadow: 0 2px 6px rgba(0,122,255,.30), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .bname { font: 700 17px/1.2 var(--display); letter-spacing: -.02em; }
  .bsub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .nav { display: grid; gap: 2px; }
  .nav button {
    display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    padding: 8px 10px; border: 0; border-radius: 10px; background: none; cursor: pointer;
    font-size: 14.5px; font-weight: 500; color: var(--text);
    transition: background .15s, transform .15s var(--spring);
  }
  .nav button:hover { background: var(--fill2); }
  .nav button:active { transform: scale(.98); }
  .nav button.active { background: var(--accent); color: #fff; }
  .ico { width: 22px; height: 22px; flex: none; color: var(--c); display: grid; place-items: center; }
  .ico svg { width: 20px; height: 20px; }
  .nav button.active .ico { color: #fff; }
  .lbl-s { display: none; }
  main { padding: 44px 40px 72px; min-width: 0; }
  main > section { max-width: 780px; margin: 0 auto; animation: viewIn .38s var(--spring); }
  @keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ================= teks & grup ================= */
  .vtitle { font: 700 34px/1.12 var(--display); margin: 0 0 6px; letter-spacing: -.025em; }
  .vsub { margin: 0 0 26px; color: var(--muted); max-width: 62ch; font-size: 15.5px; }
  .glabel { font-size: 13px; font-weight: 400; color: var(--muted); text-transform: uppercase; letter-spacing: .02em; margin: 26px 0 7px 16px; }
  .group { background: var(--card); border-radius: var(--r); margin-bottom: 14px; overflow: hidden; box-shadow: var(--shadow); }
  .group.pad { padding: 16px 18px; }
  .row { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 18px; min-height: 46px; }
  .row + .row::before, .frow2 + .frow2::before, .crow + .crow::before {
    content: ""; position: absolute; top: 0; left: 18px; right: 0; border-top: .5px solid var(--sep);
  }
  .row.between { justify-content: space-between; }
  .row.wrap { flex-wrap: wrap; }
  .row.small { font-size: 13.5px; }
  .rt { font-weight: 600; }
  .rd { font-size: 13.5px; color: var(--muted); }
  .muted { color: var(--muted); }
  .minw { min-width: 0; }
  .stepno {
    width: 28px; height: 28px; flex: none; border-radius: 50%;
    display: grid; place-items: center; font: 600 13px var(--mono); background: var(--accent-soft); color: var(--accent);
  }
  .note { font-size: 14px; padding: 12px 16px; margin-bottom: 14px; background: var(--note); border-radius: 12px; color: var(--text2); }

  /* ================= tombol ================= */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 18px; border: 0; border-radius: 980px; background: var(--fill);
    color: var(--accent); font-size: 15px; font-weight: 500; cursor: pointer;
    transition: transform .2s var(--spring), background .15s, opacity .15s;
  }
  .btn:hover { background: var(--line); }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
  .btn.big { padding: 12px 30px; font-size: 16px; font-weight: 600; }
  .btn.small { padding: 5px 13px; font-size: 13.5px; }
  .btn.danger { color: var(--red-t); }
  .btn.ghost { background: none; color: var(--accent); }
  .btn.ghost:hover { background: var(--fill2); }
  .btn:focus-visible, .opt:focus-visible, .nav button:focus-visible, .seg button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .actions .keys { margin-right: auto; font-size: 12.5px; color: var(--muted); }

  .seg { display: inline-flex; flex-wrap: wrap; gap: 0; padding: 2px; background: var(--fill); border-radius: 9px; }
  .seg button {
    border: 0; background: none; padding: 5px 14px; border-radius: 7px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: background .2s, box-shadow .2s;
  }
  .seg button.active { background: var(--card); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); font-weight: 600; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button.active { background: #636366; } }
  :root[data-theme="dark"] .seg button.active { background: #636366; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }

  /* ================= stepper ================= */
  .stepper { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 8px; }
  .step {
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 4px 0 6px; font-size: 12.5px; min-width: 0;
    color: var(--wash-text2); border: 0; background: none; text-align: left; cursor: pointer; border-radius: 6px;
  }
  .step:disabled { cursor: default; }
  .step:not(:disabled):hover .t { color: var(--accent); }
  .step:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
  .step::before { content: ""; display: block; width: 100%; height: 5px; border-radius: 5px; background: var(--step-off); box-shadow: inset 0 0 0 .5px var(--line2); transition: background .3s; }
  .stephint { font-size: 12px; color: var(--wash-text2); margin: 0 0 16px; opacity: .85; }
  .step .n { display: none; }
  .step .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .step.current { color: var(--wash-text); font-weight: 650; }
  .step.current::before { background: var(--accent); }
  .step.done::before { background: var(--green); }
  .step.skip .t { text-decoration: line-through; opacity: .6; }
  .steptitle { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .steptitle b { display: block; font: 700 20px var(--display); letter-spacing: -.02em; color: var(--wash-text); }
  .steptitle span { font-size: 14px; font-weight: 500; color: var(--wash-text2); }
  .app .glabel { color: var(--wash-text2); font-weight: 500; }
  .app .toolbar > .muted { color: var(--wash-text2); font-weight: 500; }

<script>
(function () {
  // window.confirm diblokir di artefak; tampilkan dialog sendiri lalu ulangi klik bila disetujui.
  var lastTarget = null, allowOnce = false;
  document.addEventListener("click", function (e) { lastTarget = e.target; }, true);
  window.confirm = function (msg) {
    if (allowOnce) { allowOnce = false; return true; }
    var target = lastTarget, en = document.documentElement.lang === "en";
    var destructive = /hapus|delete/i.test(String(msg));
    var scrim = document.createElement("div");
    scrim.className = "alert-scrim";
    scrim.innerHTML = '<div class="alert" role="alertdialog" aria-modal="true"><p></p><div class="alert-btns">' +
      '<button type="button" id="alertCancel"></button><button type="button" id="alertOk"></button></div></div>';
    scrim.querySelector("p").textContent = String(msg);
    var cancel = scrim.querySelector("#alertCancel"), ok = scrim.querySelector("#alertOk");
    cancel.textContent = en ? "Cancel" : "Batal";
    ok.textContent = destructive ? (en ? "Delete" : "Hapus") : "OK";
    if (destructive) ok.classList.add("destr");
    function close() { scrim.remove(); document.removeEventListener("keydown", onKey); }
    function onKey(e) { if (e.key === "Escape") close(); }
    cancel.onclick = close;
    scrim.onclick = function (e) { if (e.target === scrim) close(); };
    ok.onclick = function () {
      close();
      if (target && target.isConnected) { allowOnce = true; target.click(); allowOnce = false; }
    };
    document.addEventListener("keydown", onKey);
    document.body.appendChild(scrim);
    ok.focus();
    return false;
  };
})();
</script>

.hf-veil{position:fixed;inset:0;background:var(--hf-veil)}
.hf-veil[hidden],.hf-ring[hidden]{display:none!important}
.hf-ring{position:fixed;top:var(--hf-ry,40vh);padding:18px 14px 14px;border-radius:30px;background:linear-gradient(180deg,var(--hf-glass1),var(--hf-glass2));-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--hf-edge);box-shadow:var(--hf-shadow),inset 0 1px 0 var(--hf-edge);display:grid;place-items:center;overflow:hidden;transform-origin:var(--hf-ox,100%) 50%;animation:hfpop .3s cubic-bezier(.2,1.25,.4,1) both}
.hf[data-side="right"] .hf-ring{right:calc(var(--hf-rx,78px) + env(safe-area-inset-right,0px))}
.hf[data-side="left"] .hf-ring{left:calc(var(--hf-rx,78px) + env(safe-area-inset-left,0px))}
.hf-grid{display:grid;grid-template-columns:repeat(3,84px);grid-auto-rows:84px;gap:8px 4px}
.hf-app{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding-top:4px;text-decoration:none;color:var(--hf-ink);border-radius:16px;min-width:0;transition:transform .15s}
.hf-app:active{transform:scale(.94)}
.hf-app:focus-visible{outline:2px solid #F57F45;outline-offset:0}
.hf-logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:.02em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 5px 12px rgba(0,0,0,.14)}
.hf-t{display:block;width:100%;text-align:center;font-size:11.5px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hf-s{display:block;width:100%;text-align:center;font-size:10px;font-weight:600;color:var(--hf-muted);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-4px}
.hf-app[aria-current="page"] .hf-logo{box-shadow:0 0 0 3px var(--hf-panel),0 0 0 5px #F57F45}
.hf-app[aria-current="page"] .hf-s{color:#F57F45}
/* kilap kaca */
.hf-ring::before{content:"";position:absolute;left:-20%;right:-20%;top:-60%;height:95%;border-radius:0 0 50% 50%;background:linear-gradient(180deg,var(--hf-sheen),rgba(255,255,255,0));pointer-events:none}
.hf-grid{position:relative}
.hf-logo{position:relative;overflow:hidden}
.hf-logo::after{content:"";position:absolute;left:0;right:0;top:0;height:52%;border-radius:13px 13px 40% 40%/13px 13px 18px 18px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.08));pointer-events:none}
@keyframes hfpop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes hfbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes hfhop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-10px) scale(1.06,.95)}100%{transform:translateY(0) scale(1)}}
@keyframes hfleaf{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(6deg)}}
@keyframes hfblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){:root:not([data-anim="on"]) .hf :is(.hf-ring,.hf-bob,.hf-leaf,.hf-eyes){animation:none}:root:not([data-anim="on"]) .hf :is(.hf-dot,.hf-lumi){transition:none}}
</style>
<div class="hf" id="hf" data-side="right">
  <div class="hf-veil" id="hfVeil" hidden></div>
  <div class="hf-ring" id="hfRing" role="menu" aria-label="Pintasan app" hidden><div class="hf-grid" id="hfGrid"></div></div>
  <button type="button" class="hf-dot" id="hfDot" aria-label="Lumi: buka pintasan app" aria-expanded="false" aria-controls="hfRing">
    <svg class="hf-lumi" viewBox="12 4 86 98" aria-hidden="true">
      <defs><radialGradient id="hfLumiG" cx="40%" cy="32%" r="75%"><stop offset="0" stop-color="#FFC9A3"/><stop offset=".6" stop-color="#FF9F66"/><stop offset="1" stop-color="#F57F45"/></radialGradient></defs>
      <g class="hf-bob">
        <path d="M55 26c24 0 38 16 38 38 0 20-15 33-38 33S17 84 17 64c0-22 14-38 38-38z" fill="url(#hfLumiG)"/>
        <g class="hf-leaf"><path d="M55 27c0-8 1-13 3-17" stroke="#2E9E6A" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M58 12c7-6 16-5 19-1-5 6-13 7-19 1z" fill="#4CC38A"/><path d="M56 15c-6-5-14-4-17 0 5 5 12 5 17 0z" fill="#6ED6A2"/></g>
        <g class="hf-eyes"><ellipse cx="42" cy="58" rx="4.6" ry="5.8" fill="#2B2340"/><ellipse cx="68" cy="58" rx="4.6" ry="5.8" fill="#2B2340"/><circle cx="43.6" cy="55.8" r="1.7" fill="#fff"/><circle cx="69.6" cy="55.8" r="1.7" fill="#fff"/></g>
        <path class="hf-happy" d="M37 60q5-7 10 0M63 60q5-7 10 0" stroke="#2B2340" stroke-width="3.2" fill="none" stroke-linecap="round"/>
        <ellipse cx="34" cy="68" rx="5.5" ry="3.4" fill="#FF6F8A" opacity=".5"/><ellipse cx="76" cy="68" rx="5.5" ry="3.4" fill="#FF6F8A" opacity=".5"/>
        <path class="hf-smile" d="M49 70q6 6 12 0" stroke="#2B2340" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path class="hf-grin" d="M47 68q8 11 16 0z" fill="#2B2340"/>
        <ellipse class="hf-o" cx="55" cy="72" rx="3.6" ry="4.4" fill="#2B2340"/>
      </g>
    </svg>
  </button>
</div>
<script>
(function(){
  var BASE='https://faiqdk07-tech.github.io/';
  var APPS=[
    {k:'progres-harian',l:'Progres',s:'Jadwal harian',t:'PH',c:'linear-gradient(135deg,#3DD07B,#1FA855)',h:'progres-harian/#hari-ini'},
    {k:'latihan-kuantitatif',l:'Kuantitatif',s:'PU · PK · PM',t:'LK',c:'linear-gradient(135deg,#FF8E78,#EE5E4A)',h:'latihan-kuantitatif/'},
    {k:'latihan-ppu-pbm',l:'PPU & PBM',s:'Kebahasaan',t:'PB',c:'linear-gradient(135deg,#34C3B3,#1C9486)',h:'latihan-ppu-pbm/'},
    {k:'vocab-lab',l:'Vocab Lab',s:'Kosakata',t:'VL',c:'linear-gradient(135deg,#3B8BFF,#5B5BE0)',h:'vocab-lab/'},
    {k:'ruang-baca',l:'Ruang Baca',s:'Literasi',t:'RB',c:'linear-gradient(135deg,#FFC24D,#F08A1C)',h:'ruang-baca/'}
  ];
  var hf=document.getElementById('hf'), dot=document.getElementById('hfDot'), ring=document.getElementById('hfRing'), veil=document.getElementById('hfVeil'), grid=document.getElementById('hfGrid');
  var here=(location.pathname.split('/').filter(Boolean)[0]||'').toLowerCase();
  grid.innerHTML=APPS.map(function(a){ var cur=here===a.k; return '<a role="menuitem" class="hf-app" href="'+BASE+a.h+'"'+(cur?' aria-current="page"':'')+'><span class="hf-logo" style="background:'+a.c+'">'+a.t+'</span><span class="hf-t">'+a.l+'</span><span class="hf-s">'+(cur?'Sedang dibuka':a.s)+'</span></a>'; }).join('');
  var KEY='hubfab.pos', pos={side:'right',y:0.62};
  try{ var p=JSON.parse(localStorage.getItem(KEY)||'null'); if(p&&(p.side==='left'||p.side==='right')&&p.y>0&&p.y<1) pos=p; }catch(e){}
  function clampY(px){ return Math.max(80,Math.min(window.innerHeight-140,px)); }
  function place(){ var y=clampY(pos.y*window.innerHeight); hf.dataset.side=pos.side; hf.style.setProperty('--hf-y',y+'px');
    hf.style.setProperty('--hf-ry',Math.max(12,Math.min(window.innerHeight-232,y-108))+'px');
    hf.style.setProperty('--hf-rx',Math.max(0,Math.min(78,window.innerWidth-300))+'px'); hf.style.setProperty('--hf-ox',pos.side==='right'?'100%':'0%'); }
  function hop(){ hf.classList.remove('hop'); void hf.offsetWidth; hf.classList.add('hop'); setTimeout(function(){ hf.classList.remove('hop'); },520); }
  function open(){ if(hf.classList.contains('open')) return; hf.classList.add('open'); hop(); ring.hidden=false; veil.hidden=false; dot.setAttribute('aria-expanded','true'); dot.setAttribute('aria-label','Lumi: tutup pintasan app'); var f=grid.querySelector('.hf-app:not([aria-current])'); if(f) f.focus({preventScroll:true}); }
  function close(){ if(!hf.classList.contains('open')) return; hf.classList.remove('open'); ring.hidden=true; veil.hidden=true; dot.setAttribute('aria-expanded','false'); dot.setAttribute('aria-label','Lumi: buka pintasan app'); }
  place(); window.addEventListener('resize',place);
  var sx=0, sy=0, moved=false, pid=null;
  dot.addEventListener('pointerdown',function(e){ pid=e.pointerId; sx=e.clientX; sy=e.clientY; moved=false; try{ dot.setPointerCapture(pid); }catch(_){} });
  dot.addEventListener('pointermove',function(e){ if(pid!==e.pointerId) return; var dx=e.clientX-sx, dy=e.clientY-sy;
    if(!moved&&Math.abs(dx)+Math.abs(dy)<8) return; if(!moved){ moved=true; close(); hf.classList.add('drag'); }
    dot.style.left=(e.clientX-31)+'px'; dot.style.right='auto'; hf.style.setProperty('--hf-y',clampY(e.clientY)+'px'); });
  function reset(){ hf.classList.remove('drag'); dot.style.left=''; dot.style.right=''; }
  dot.addEventListener('pointerup',function(e){ if(pid!==e.pointerId) return; pid=null;
    if(moved){ reset(); pos={side:e.clientX<window.innerWidth/2?'left':'right',y:clampY(e.clientY)/window.innerHeight}; try{ localStorage.setItem(KEY,JSON.stringify(pos)); }catch(_){} place(); }
    else { hf.classList.contains('open')?close():open(); } });
  dot.addEventListener('pointercancel',function(e){ if(pid===e.pointerId){ pid=null; reset(); place(); } });
  dot.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); hf.classList.contains('open')?close():open(); } });
  veil.addEventListener('click',close);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
})();
</script>
</body>
</html>
