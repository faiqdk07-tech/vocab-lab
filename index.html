<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocab Lab</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --text: #1f2328; --muted: #6b7076;
    --line: #e3e0d8; --accent: #2f5d50; --accent-soft: #e4efe9;
    --ok: #1f7a4d; --ok-soft: #e3f4ea; --no: #b3402f; --no-soft: #fbe9e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181b; --card: #1e2226; --text: #e8e6e1; --muted: #9aa0a6;
      --line: #30353a; --accent: #7fc4ac; --accent-soft: #23332d;
      --ok: #6fd19c; --ok-soft: #1d3327; --no: #f08a78; --no-soft: #3a2421;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  header h1 { margin: 0; font-size: 1.5rem; letter-spacing: -0.01em; }
  header p { margin: 2px 0 14px; color: var(--muted); font-size: 0.9rem; }
  .progress { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); }
  .track { height: 6px; background: var(--line); border-radius: 99px; margin: 6px 0 16px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .modes { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
  .mode {
    flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 7px 14px; border-radius: 99px; font: inherit; font-size: 0.88rem; cursor: pointer;
  }
  .mode.active { background: var(--accent); border-color: var(--accent); color: var(--card); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  #tag {
    display: inline-block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; color: var(--accent); background: var(--accent-soft);
    padding: 3px 10px; border-radius: 99px;
  }
  #prompt { font-size: 1.25rem; margin: 12px 0 4px; }
  #sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 16px; }
  .blank { color: var(--accent); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .chip { background: var(--accent-soft); color: var(--accent); padding: 4px 12px; border-radius: 8px; font-weight: 600; }
  .plus { color: var(--muted); }
  #options { display: grid; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
    background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; font: inherit; cursor: pointer;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt .num {
    flex: none; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center;
    font-size: 0.8rem; background: var(--bg); color: var(--muted);
  }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .opt.wrong { border-color: var(--no); background: var(--no-soft); }
  .opt:disabled { cursor: default; }
  .feedback { margin-top: 16px; padding: 14px 16px; border-radius: 12px; font-size: 0.95rem; }
  .feedback.ok { background: var(--ok-soft); }
  .feedback.no { background: var(--no-soft); }
  .feedback ul { margin: 8px 0 0; padding-left: 20px; }
  .verdict { font-weight: 700; margin-bottom: 4px; }
  .feedback.ok .verdict { color: var(--ok); }
  .feedback.no .verdict { color: var(--no); }
  #nextBtn {
    margin-top: 14px; width: 100%; padding: 12px; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--card); font: inherit; font-weight: 600; cursor: pointer;
  }
  .note { font-size: 0.85rem; color: var(--muted); background: var(--accent-soft); padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; }
  footer { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 0.8rem; }
  #resetBtn { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Vocab Lab</h1>
    <p>Latihan membaca kata asing lewat prefix, root, dan suffix.</p>
  </header>

  <div class="progress"><span id="mastery"></span><span id="score"></span></div>
  <div class="track"><div id="bar"></div></div>

  <nav class="modes">
    <button class="mode active" data-mode="mix">Campur</button>
    <button class="mode" data-mode="pos">Jenis kata</button>
    <button class="mode" data-mode="fill">Isi kalimat</button>
    <button class="mode" data-mode="affix">Imbuhan</button>
    <button class="mode" data-mode="parts">Pecah kata</button>
    <button class="mode" data-mode="rel">Sinonim & antonim</button>
  </nav>

  <div id="relNote" class="note" hidden>
    Saran: latih dulu katanya di mode lain. Di mode Campur, sinonim dan antonim baru muncul setelah sebuah kata dijawab benar 3 kali, supaya tidak tertukar.
  </div>

  <main class="card">
    <span id="tag"></span>
    <div id="prompt"></div>
    <div id="sub"></div>
    <div id="options"></div>
    <div id="feedback" class="feedback" hidden></div>
    <button id="nextBtn" hidden>Soal berikutnya →</button>
  </main>

  <footer>
    <span>Tombol 1–4 untuk menjawab, Enter untuk lanjut</span>
    <button id="resetBtn">Reset progres</button>
  </footer>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
